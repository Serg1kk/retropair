# Конфиг SpecStory CLI — приватность по умолчанию.
#
# Куда положить: ~/.specstory/cli/config.toml
# (создайте папку, если её нет: mkdir -p ~/.specstory/cli)
# Действует на все проекты на машине. Проектный вариант — .specstory/cli/config.toml
# внутри репозитория — переопределяет этот, класть его не нужно.
#
# Зачем: по умолчанию SpecStory отправляет анонимную аналитику и проверяет
# обновления при каждом запуске, а при входе в аккаунт синхронизирует сессии
# в своё облако. На рабочем ноутбуке с кодом под NDA всё это должно быть выключено.
# С этим файлом SpecStory v2.6.0 не делает сетевых вызовов.
#
# В аккаунт SpecStory Cloud не входите: specstory login не запускайте.

[cloud_sync]
# Синхронизация сессий в облако SpecStory — выключена.
enabled = false

[analytics]
# Анонимная продуктовая аналитика — выключена.
enabled = false

[version_check]
# Проверка новой версии при каждом запуске — выключена.
# Обновляйтесь осознанно, руками, после того как проверили новую версию.
enabled = false

[telemetry]
# Endpoint не задаётся — телеметрия не работает. Текст промптов в спаны не класть
# на случай, если endpoint однажды появится в окружении.
prompts = false

[redaction]
# Редакция секретов — явно включена, не полагаемся на дефолт вендора.
enabled = true
